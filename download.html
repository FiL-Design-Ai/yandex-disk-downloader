<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Яндекс.Диск: скачивание по ссылке</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121314;
      --surface: #1e1f22;
      --line: rgba(255, 255, 255, .08);
      --stroke: rgba(255, 255, 255, .22);
      --text: #ffffff;
      --muted: #8a9199;
      --faint: #50565e;
      --accent: #2bebc8;
      --ok: #2bebc8;
      --err: #ff7d43;
    }
    body { font: 14px/1.5 system-ui, sans-serif; max-width: 720px; margin: 0 auto; padding: 24px 20px 32px; box-sizing: border-box; min-height: 100vh; background: var(--bg); color: var(--text); }
    button, input { font: inherit; }
    button { padding: 9px 18px; border: 0; border-radius: 999px; background: var(--accent); color: #04201a; font-weight: 600; cursor: pointer; transition: background .15s, transform .15s; }
    button:hover:not(:disabled) { background: #5cf2d8; }
    button.quiet { background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--stroke); font-weight: 500; }
    button.quiet:hover:not(:disabled) { background: rgba(255, 255, 255, .05); }
    button:active:not(:disabled) { transform: scale(.97); }
    button:focus-visible, input:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
    button:disabled { background: transparent; color: var(--faint); box-shadow: inset 0 0 0 1px var(--line); cursor: default; }
    button[hidden] { display: none; }
    #cancel:disabled { display: none; }
    .link-row { display: flex; gap: 10px; }
    .link-row input { flex: 1; min-width: 0; padding: 11px 16px; border: 0; border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); outline: none; }
    .link-row input::placeholder { color: var(--muted); }
    .link-row input:focus { box-shadow: inset 0 0 0 1px var(--accent); }
    #recent { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
    #recent:empty { display: none; }
    .chip { padding: 4px 12px; font-size: 13px; font-weight: 500; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0 10px; }
    #summary { color: var(--muted); font-size: 13px; }
    #selectAll { padding: 0; background: none; color: var(--muted); font-size: 13px; font-weight: 500; border-radius: 0; box-shadow: none; }
    #selectAll:hover:not(:disabled) { background: none; color: var(--text); }
    #selectAll:disabled { background: none; box-shadow: none; color: var(--faint); }
    #list { max-height: 420px; overflow-y: auto; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); padding: 4px 16px; }
    #list:empty { display: none; }
    .row { display: flex; gap: 12px; padding: 11px 0; align-items: center; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .row input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
    .row .name { flex: 1; word-break: break-all; font-size: 14px; }
    .row .size { color: var(--muted); white-space: nowrap; font-size: 13px; font-variant-numeric: tabular-nums; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    #progress { color: var(--muted); font-size: 13px; min-height: 18px; margin-top: 14px; }
    #bar { height: 4px; background: rgba(255, 255, 255, .08); border-radius: 2px; overflow: hidden; margin-top: 10px; }
    #bar[hidden] { display: none; }
    #fill { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
    #status { min-height: 22px; margin-top: 14px; white-space: pre-line; font-size: 14px; }
    .err { color: var(--err); }
    .ok { color: var(--ok); }
    #openTab[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="link-row">
    <input type="text" id="link" placeholder="Вставьте ссылку на Яндекс.Диск" aria-label="Ссылка на Яндекс.Диск">
    <button id="open">Показать файлы</button>
  </div>
  <div id="recent"></div>
  <div class="toolbar">
    <span id="summary"></span>
    <button id="selectAll" disabled>Выбрать все</button>
  </div>
  <div id="list"></div>
  <div class="actions">
    <button id="downloadSelected" disabled>Выбрать папку и скачать</button>
    <button id="cancel" class="quiet" disabled>Остановить загрузку</button>
    <button id="openTab" class="quiet" hidden>Открыть в новой вкладке</button>
  </div>
  <div id="progress"></div>
  <div id="bar" hidden role="progressbar" aria-label="Прогресс загрузки" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="yandex-api.js"></script>
  <script src="download.js"></script>
</body>
</html>
