<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Яндекс.Диск: скачивание по ссылке</title>
  <style>
    body { font: 14px/1.45 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #1d1f23; }
    h1 { font-size: 18px; margin: 0 0 14px; }
    button, input { font: inherit; }
    button { padding: 8px 14px; border: 1px solid #d0d4da; border-radius: 6px; background: #fff; color: #1d1f23; cursor: pointer; }
    button.primary { background: #0b5ed7; border-color: #0b5ed7; color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    button[hidden] { display: none; }
    #cancel:disabled { display: none; }
    .link-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .link-row input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #d0d4da; border-radius: 6px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 16px 0 6px; }
    #summary { color: #5f6670; }
    #list { max-height: 420px; overflow-y: auto; border: 1px solid #d0d4da; border-radius: 6px; padding: 0 10px; }
    #list:empty { display: none; }
    .row { display: flex; gap: 10px; padding: 7px 0; align-items: center; border-bottom: 1px solid #eef0f3; }
    .row:last-child { border-bottom: 0; }
    .row .name { flex: 1; word-break: break-all; }
    .row .size { color: #5f6670; white-space: nowrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    #progress { color: #5f6670; font-size: 13px; min-height: 18px; margin-top: 10px; }
    #status { min-height: 22px; margin-top: 10px; white-space: pre-line; }
    .err { color: #b00020; }
    .ok { color: #1b7f3b; }
    .hint { color: #5f6670; font-size: 13px; margin: 18px 0 0; }
    #recent { display: flex; flex-wrap: wrap; gap: 6px; margin: -6px 0 12px; }
    #recent:empty { display: none; }
    .chip { padding: 4px 10px; font-size: 13px; border-radius: 999px; }
    #bar { height: 6px; background: #e5e7eb; border-radius: 3px; overflow: hidden; margin-top: 10px; }
    #bar[hidden] { display: none; }
    #fill { height: 100%; width: 0; background: #0b5ed7; transition: width .3s; }
    #openTab[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Яндекс.Диск: скачивание по ссылке</h1>
  <div class="link-row">
    <input type="text" id="link" placeholder="Вставьте ссылку, например https://disk.yandex.ru/d/...">
    <button id="open" class="primary">Показать файлы</button>
  </div>
  <div id="recent"></div>
  <div class="toolbar">
    <span id="summary"></span>
    <button id="selectAll" disabled>Выбрать все</button>
  </div>
  <div id="list"></div>
  <div class="actions">
    <button id="downloadSelected" class="primary" disabled>Выбрать папку и скачать</button>
    <button id="useSaved" hidden>Скачать в сохранённую папку</button>
    <button id="cancel" disabled>Остановить</button>
    <button id="openTab" hidden>Открыть в новой вкладке</button>
  </div>
  <div id="progress"></div>
  <div id="bar" hidden><div id="fill"></div></div>
  <div id="status"></div>
  <p class="hint">Внутри выбранной папки появится папка с названием из Яндекс.Диска (например, «Дуся_v2») с той же структурой. Файлы, которые уже есть на компьютере и совпадают с Яндекс.Диском, не скачиваются заново.</p>
  <script src="yandex-api.js"></script>
  <script src="download.js"></script>
</body>
</html>
