<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Яндекс.Диск: скачивание по ссылке</title>
  <style>
    :root { color-scheme: dark; --bg: #0e0f11; --card: rgba(255, 255, 255, .05); --border: rgba(255, 255, 255, .10); --text: #f4f7f8; --muted: #8a9199; --accent: #02e7ff; --accent-text: #04191d; --err: #ff7d43; --ok: #02e7ff; }
    body { font: 13px/1.45 system-ui, sans-serif; width: 420px; margin: 0; padding: 16px; box-sizing: border-box; background: var(--bg); color: var(--text); }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 10px 14px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: var(--text); outline: none; }
    input[type=text]::placeholder { color: var(--muted); }
    input[type=text]:focus { border-color: var(--accent); }
    button { padding: 9px 16px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { background: #5ff0ff; }
    button:active { transform: scale(.97); }
    button:focus-visible, input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent); }
    .err { color: var(--err); }
    .ok { color: var(--ok); }
    #status { min-height: 18px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Яндекс.Диск: скачивание по ссылке</h1>
  <input type="text" id="link" placeholder="https://disk.yandex.ru/d/..." aria-label="Ссылка на Яндекс.Диск">
  <button id="open">Показать файлы</button>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="yandex-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
